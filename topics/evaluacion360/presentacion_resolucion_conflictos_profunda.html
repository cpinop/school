<style>
:root{--vino:#711c35;--vino2:#a73d5d;--negro:#171214;--crema:#f5eddd;--papel:#fffaf0;--linea:#ddcfbd;--oro:#d7a64a;--gris:#756b6d}*{box-sizing:border-box}html{font-size:16px}body{margin:0;background:var(--crema);color:var(--negro);font-family:Georgia,serif;transition:.2s}body.dark{--crema:#151113;--negro:#f8efdf;--papel:#251c20;--linea:#4d3940;--gris:#c8b9b1}button{font:inherit;cursor:pointer}.bar{background:var(--negro);color:var(--crema);min-height:66px;padding:12px 4vw;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:.85rem;font-weight:bold;letter-spacing:.08em}.tools{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.tool,.nav button{border:1px solid #8a777c;background:transparent;color:var(--crema);border-radius:9px;padding:8px 11px}.tool:hover{background:var(--vino)}.main{width:min(1120px,92vw);margin:30px auto 100px}.slide{display:none;animation:in .28s ease}.slide.active{display:block}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.eyebrow{color:var(--vino2);font-weight:bold;text-transform:uppercase;letter-spacing:.15em;font-size:.76rem}.dark .eyebrow,.dark h1,.dark h2,.dark h3{color:#f0a2ba}h1{font-size:clamp(2.4rem,6vw,5.7rem);line-height:.96;color:var(--vino);margin:15px 0 22px}h2{font-size:clamp(1.8rem,4vw,3.2rem);line-height:1.05;color:var(--vino);margin:10px 0 20px}h3{color:var(--vino);margin:0 0 7px}p{line-height:1.52}.lead{font-size:1.25rem;max-width:800px}.hero{min-height:calc(100vh - 220px);display:grid;grid-template-columns:1.4fr .6fr;align-items:center;gap:45px}.mark{border:2px solid var(--vino);border-radius:25px;padding:30px;background:var(--papel);box-shadow:13px 13px 0 var(--vino)}.mark b{font-size:5rem;color:var(--vino);display:block;line-height:1}.pill{display:inline-block;border:1px solid var(--vino2);color:var(--vino2);padding:7px 12px;border-radius:99px;margin:4px 2px}.dark .pill{color:#f0a2ba}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:15px}.card{background:var(--papel);border:1px solid var(--linea);border-radius:15px;padding:17px;box-shadow:0 4px 0 rgba(113,28,53,.09)}.card strong{color:var(--vino)}.dark .card strong{color:#f0a2ba}.call{border-left:6px solid var(--vino);background:rgba(113,28,53,.09);padding:14px 17px;margin:18px 0}.case{background:var(--negro);color:var(--crema);border-radius:16px;padding:20px;margin:15px 0;line-height:1.55}.case b{color:#ffd987}.steps{counter-reset:x;display:grid;gap:10px}.step{display:flex;gap:13px}.step:before{counter-increment:x;content:counter(x);background:var(--vino);color:var(--crema);border-radius:50%;min-width:30px;height:30px;display:grid;place-items:center;font-weight:bold}.table{border-collapse:collapse;width:100%;background:var(--papel);font-size:.94rem}.table th,.table td{border:1px solid var(--linea);padding:10px;text-align:left;vertical-align:top}.table th{background:var(--vino);color:var(--crema)}.tag{font-size:.75rem;background:var(--oro);color:#20150e;padding:4px 7px;border-radius:5px;font-weight:bold}.action{background:var(--vino);color:var(--crema);border:0;border-radius:9px;padding:10px 14px;font-weight:bold}.secondary{background:transparent;color:var(--vino);border:1px solid var(--vino);border-radius:9px;padding:9px 13px}.dark .secondary{color:#f0a2ba;border-color:#f0a2ba}.answer{display:none;margin-top:12px;border-top:1px solid var(--linea);padding-top:12px}.answer.show{display:block}.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--negro);color:var(--crema);padding:10px 4vw;display:flex;justify-content:space-between;align-items:center;gap:15px}.nav{display:flex;gap:8px}.nav button{background:var(--crema);color:var(--negro);border:0}.progress{position:fixed;bottom:57px;left:0;height:4px;background:var(--vino2);transition:.3s}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:4;padding:6vh 5vw;overflow:auto}.modal.open{display:block}.modalin{background:var(--papel);color:var(--negro);max-width:780px;margin:auto;border:3px solid var(--vino);border-radius:20px;padding:25px}.modalhead{display:flex;justify-content:space-between}.close{background:var(--vino);color:white;border:0;border-radius:50%;width:33px;height:33px}.ref{padding-left:24px;text-indent:-24px;line-height:1.45}.muted{color:var(--gris);font-size:.9rem}textarea{font:inherit;width:100%;background:var(--crema);color:var(--negro);border:1px solid var(--linea);border-radius:8px;padding:9px}@media(max-width:760px){.hero{grid-template-columns:1fr;min-height:auto}.mark{display:none}.bar{align-items:flex-start}.bottom{padding-left:3vw;padding-right:3vw}.table{font-size:.8rem}}
</style></head>
<body><header class="bar"><div class="brand">CLASE 14 · ENTRENAMIENTO APLICADO</div><div class="tools"><button class="tool" onclick="theme()">◐ Tema</button><button class="tool" onclick="font(-1)">A−</button><button class="tool" onclick="font(1)">A+</button><button class="tool" onclick="summary()">🎁 Resumen</button><button class="tool" onclick="question()">⚄ Pregunta</button></div></header>

<script>
const S=[
`<div class="hero"><div><div class="eyebrow">Clase aplicada · 50 minutos</div><h1>Resolver conflictos y recuperar resultados</h1><p class="lead">No se trata de “llevarse bien”: se trata de diagnosticar, intervenir y dejar una coordinación que pueda comprobarse.</p><span class="pill">Casos reales</span><span class="pill">Guiones</span><span class="pill">Decisiones</span></div><div class="mark"><b>26</b><p>diapositivas de entrenamiento<br>para aplicar en tu organización</p></div></div></section>`,
`<div class="eyebrow">Ruta de aprendizaje</div><h2>Hoy vas a salir con una intervención preparada</h2><div class="grid"><div class="card"><h3>Diagnóstico</h3><p>Determinar qué hay debajo del conflicto visible.</p></div><div class="card"><h3>Decisión</h3><p>Elegir la herramienta correcta según riesgo, poder y relación.</p></div><div class="card"><h3>Intervención</h3><p>Usar una conversación, negociación, mediación o protocolo.</p></div><div class="card"><h3>Resultado</h3><p>Convertir el acuerdo en conducta observable y seguimiento.</p></div></div><div class="call"><b>Regla de la clase:</b> cada metodología debe responder “¿qué hago mañana a las 9:00?”</div></section>`,
`<div class="eyebrow">Diagnóstico</div><h2>El conflicto visible rara vez es toda la historia</h2><div class="case"><b>Lo visible:</b> “María entrega tarde los reportes y su jefatura quiere sancionarla”.</div><div class="grid"><div class="card"><h3>Hipótesis 1</h3><p>Falta de compromiso.</p></div><div class="card"><h3>Hipótesis 2</h3><p>No entiende el nuevo estándar.</p></div><div class="card"><h3>Hipótesis 3</h3><p>El proceso tiene información tardía.</p></div><div class="card"><h3>Hipótesis 4</h3><p>El KPI premia velocidad, no calidad.</p></div></div><p><b>Pregunta aplicada:</b> ¿qué evidencia necesitarías antes de decidir que es un problema de actitud?</p></section>`,
`<div class="eyebrow">Herramienta de diagnóstico</div><h2>Seis filtros antes de actuar</h2><div class="steps"><div class="step"><p><b>Hechos:</b> ¿qué ocurrió, cuándo y cuántas veces?</p></div><div class="step"><p><b>Impacto:</b> ¿qué daño produjo en personas, operación, clientes o datos?</p></div><div class="step"><p><b>Poder:</b> ¿quién puede castigar, evaluar o despedir?</p></div><div class="step"><p><b>Riesgo:</b> ¿hay acoso, violencia, amenaza, discriminación o represalia?</p></div><div class="step"><p><b>Causa:</b> ¿conducta, conversación, intereses, rol o sistema?</p></div><div class="step"><p><b>Resultado:</b> ¿qué debe ser distinto dentro de 7, 30 o 90 días?</p></div></div><div class="call">Si hay riesgo alto, la prioridad es proteger y formalizar. Si el riesgo es bajo, puedes investigar conversando.</div></section>`,
`<div class="eyebrow">Metodología 1 · formal-normativa</div><h2>Cuando el conflicto cruza un límite</h2><p>La Ley Karin, los protocolos internos y las instrucciones de la Dirección del Trabajo ponen el foco en prevención, resguardo, investigación y respuesta. No buscan que la persona afectada “negocie” su seguridad.</p><div class="grid"><div class="card"><h3>Úsala si...</h3><p>Hay hostigamiento, violencia, acoso, discriminación, amenaza, represalia o abuso de poder.</p></div><div class="card"><h3>La decisión crítica</h3><p>No esperar a tener certeza absoluta para adoptar medidas de resguardo proporcionales.</p></div><div class="card"><h3>Error frecuente</h3><p>Convocar a una reunión conjunta demasiado pronto y exponer a la persona afectada.</p></div></div></section>`,
`<div class="eyebrow">Caso formal</div><h2>“Solo era una broma”</h2><div class="case"><b>Situación:</b> un supervisor comparte memes sexuales sobre una trabajadora en el chat del equipo. Ella pide que pare; al día siguiente la excluyen de una reunión y recibe peores turnos.</div><div class="steps"><div class="step"><p><b>No hacer:</b> pedirle que “lo converse directamente” con el supervisor si teme represalias.</p></div><div class="step"><p><b>Hacer:</b> registrar hechos, resguardar canales y evaluar medidas sobre contacto, turnos y confidencialidad.</p></div><div class="step"><p><b>Investigar:</b> preservar mensajes, fechas, testigos y decisiones posteriores.</p></div><div class="step"><p><b>Prevenir:</b> revisar si el equipo normaliza bromas, exclusión o castigo informal.</p></div></div><button class="secondary" onclick="reveal('a1')">¿Qué evidencia pedirías?</button><div id="a1" class="answer">Mensajes originales, fechas, participantes, cambios de turnos, actas o registros de reuniones y testimonios. Evita pedir a la denunciante que confronte sola a la persona señalada.</div></section>`,
`<div class="eyebrow">Formal-normativo</div><h2>La calidad del proceso importa tanto como la conclusión</h2><table class="table"><tr><th>Momento</th><th>Aplicación concreta</th><th>Control de calidad</th></tr><tr><td>Recepción</td><td>Registrar incluso si la denuncia es verbal.</td><td>Fecha, canal, hechos y persona receptora.</td></tr><tr><td>Resguardo</td><td>Reducir contacto o exposición innecesaria.</td><td>No castigar indirectamente a quien denuncia.</td></tr><tr><td>Investigación</td><td>Contrastar versiones y documentos.</td><td>Imparcialidad, confidencialidad y trazabilidad.</td></tr><tr><td>Cierre</td><td>Medidas proporcionales y prevención.</td><td>Comunicar lo que corresponda sin revelar datos protegidos.</td></tr></table><div class="call">El procedimiento no es “ganar un caso”; es controlar un riesgo humano, legal y operacional.</div></section>`,
`<div class="eyebrow">Metodología 2 · conversacional</div><h2>Cuando el quiebre está en la coordinación</h2><p>En la perspectiva de Maturana, una organización se sostiene en redes de conversaciones. Un conflicto aparece cuando las personas dejan de coordinar acciones o interpretan de forma incompatible una promesa, una instrucción o un estándar.</p><div class="grid"><div class="card"><h3>Pregunta poco útil</h3><p>“¿Quién tiene la culpa?”</p></div><div class="card"><h3>Pregunta productiva</h3><p>“¿Qué coordinación se rompió y qué necesitamos acordar ahora?”</p></div><div class="card"><h3>Dato no obvio</h3><p>La emoción cambia la información disponible: desde la desconfianza, las personas omiten o defienden; desde la seguridad, explican.</p></div></div></section>`,
`<div class="eyebrow">Caso conversacional</div><h2>El correo que detonó una pelea</h2><div class="case"><b>Situación:</b> Finanzas escribe “Como siempre, Operaciones manda datos incompletos”. Operaciones responde copiando a toda la gerencia: “Finanzas no entiende el negocio”. El cierre mensual se detiene.</div><div class="grid"><div class="card"><h3>Hecho</h3><p>Faltaron tres campos en el archivo del día 30.</p></div><div class="card"><h3>Juicios</h3><p>“Como siempre”, “no entiende”, “son incompetentes”.</p></div><div class="card"><h3>Quiebre real</h3><p>No existe un estándar compartido de archivo ni una instancia de revisión previa.</p></div></div><p><b>Intervención:</b> reunión breve con hechos, impacto, causa del proceso y nuevo estándar; no debate sobre quién es “más colaborativo”.</p></section>`,
`<div class="eyebrow">Conversación aplicada</div><h2>Guion de 7 movimientos</h2><div class="steps"><div class="step"><p><b>1. Abrir:</b> “Quiero resolver el retraso, no buscar culpables”.</p></div><div class="step"><p><b>2. Afirmar:</b> “Faltaron los campos X, Y y Z el 30 de cada mes”.</p></div><div class="step"><p><b>3. Impacto:</b> “El cierre se retrasó 18 horas”.</p></div><div class="step"><p><b>4. Indagar:</b> “¿Qué hizo difícil completar esos campos?”</p></div><div class="step"><p><b>5. Reconocer:</b> “Entiendo que la fuente llega tarde; eso cambia la solución”.</p></div><div class="step"><p><b>6. Pedir:</b> “Necesito el archivo completo a las 13:00 del día 30”.</p></div><div class="step"><p><b>7. Cerrar:</b> “Acordamos responsable, estándar y revisión el día 29”.</p></div></div></section>`,
`<div class="eyebrow">Metodología 3 · Harvard</div><h2>Negociar no es ceder: es diseñar intercambios</h2><p>El modelo de Fisher, Ury y Patton trabaja con personas, intereses, opciones y criterios objetivos. Su potencia aparece cuando hay intereses legítimos incompatibles, pero aún existe margen de decisión.</p><table class="table"><tr><th>Elemento</th><th>Aplicación</th></tr><tr><td>Posición</td><td>“No trabajaré los viernes”.</td></tr><tr><td>Interés</td><td>Cuidado familiar, descanso, previsibilidad.</td></tr><tr><td>Interés de la organización</td><td>Cubrir la operación y reducir horas extra.</td></tr><tr><td>Opción</td><td>Turnos rotativos con calendario anticipado y prueba de 30 días.</td></tr><tr><td>Criterio</td><td>Demanda histórica, contrato, cobertura mínima y datos de ausentismo.</td></tr></table></section>`,
`<div class="eyebrow">Caso de negociación</div><h2>El KPI que enfrenta a Ventas y Operaciones</h2><div class="case"><b>Situación:</b> Ventas promete entregas en 24 horas para cumplir su meta. Operaciones necesita 72 horas. Ambos equipos reciben incentivos distintos y se culpan por los reclamos de clientes.</div><div class="grid"><div class="card"><h3>Posiciones</h3><p>Ventas: “Hay que prometer 24 horas”.<br>Operaciones: “Es imposible”.</p></div><div class="card"><h3>Intereses</h3><p>Ventas necesita conversión; Operaciones, capacidad real y calidad.</p></div><div class="card"><h3>Opciones</h3><p>Segmentar clientes, prometer según capacidad, bono compartido, tablero común.</p></div></div><button class="secondary" onclick="reveal('a2')">Ver un acuerdo posible</button><div id="a2" class="answer">Promesa de 24 horas solo para productos con stock y capacidad confirmada; indicador compartido de entrega completa y satisfacción; revisión del bono después de cuatro semanas.</div></section>`,
`<div class="eyebrow">Negociación avanzada</div><h2>Preguntas que descubren intereses sin invadir</h2><div class="grid"><div class="card"><p>“¿Qué problema intentas evitar con esta propuesta?”</p></div><div class="card"><p>“¿Qué condición tendría que cumplirse para que fuera aceptable?”</p></div><div class="card"><p>“¿Qué parte es imprescindible y qué parte podría ajustarse?”</p></div><div class="card"><p>“¿Qué dato nos ayudaría a decidir, en vez de discutir opiniones?”</p></div></div><div class="call"><b>Concesión inteligente:</b> no entregues algo sin recibir una condición que haga viable el acuerdo. Ejemplo: flexibilidad horaria a cambio de calendario, cobertura y revisión.</div></section>`,
`<div class="eyebrow">Metodología 4 · mediación</div><h2>Cuando el diálogo directo ya está contaminado</h2><p>La mediación agrega estructura y un tercero imparcial. No busca descubrir un ganador: busca que las partes puedan hablar de hechos, intereses y opciones sin repetir la escalada.</p><div class="grid"><div class="card"><h3>Antes</h3><p>Verificar voluntariedad, seguridad y que no exista una asimetría que invalide el proceso.</p></div><div class="card"><h3>Durante</h3><p>Reglas, turnos, reformulación, reuniones privadas si corresponde y agenda de temas.</p></div><div class="card"><h3>Después</h3><p>Acuerdo específico, mecanismo de incumplimiento y fecha de revisión.</p></div></div><div class="call">Un mediador no debe convertirse en “juez informal” ni compartir confidencias de una parte sin autorización.</div></section>`,
`<div class="eyebrow">Caso de mediación</div><h2>Dos jefaturas, un proyecto detenido</h2><div class="case"><b>Situación:</b> Tecnología acusa a Compras de bloquear el proyecto. Compras acusa a Tecnología de cambiar requerimientos sin avisar. Después de tres reuniones, cada área lleva su propio acta.</div><div class="steps"><div class="step"><p><b>Agenda común:</b> decisiones pendientes, cambios, responsables y fechas.</p></div><div class="step"><p><b>Regla:</b> cada afirmación debe asociarse a un documento, fecha o ejemplo.</p></div><div class="step"><p><b>Interés compartido:</b> liberar el proyecto sin aumentar riesgo ni costo.</p></div><div class="step"><p><b>Acuerdo:</b> cambios sobre cierto monto requieren aprobación; un único tablero registra versión, dueño y fecha.</p></div></div><button class="secondary" onclick="reveal('a3')">¿Cuándo no mediarías?</button><div id="a3" class="answer">Cuando hay violencia, amenaza, acoso grave, temor que impide participar libremente o una investigación formal que debe proteger la integridad del proceso.</div></section>`,
`<div class="eyebrow">Metodología 5 · rol organizacional</div><h2>Si el rol es ambiguo, el conflicto se recicla</h2><p>El Análisis del Rol Organizacional ayuda a mirar la relación entre tarea, autoridad, recursos y expectativas. La pregunta no es solo “¿quién falló?”, sino “¿qué diseño hizo probable este fallo?”</p><table class="table"><tr><th>Dimensión</th><th>Pregunta de auditoría</th></tr><tr><td>Propósito</td><td>¿Qué resultado existe para este cargo?</td></tr><tr><td>Autoridad</td><td>¿Qué puede decidir sin pedir permiso?</td></tr><tr><td>Dependencias</td><td>¿De quién necesita información o aprobación?</td></tr><tr><td>Recursos</td><td>¿Tiene tiempo, capacitación, datos y herramientas?</td></tr><tr><td>Evaluación</td><td>¿Se le mide por algo que realmente controla?</td></tr></table></section>`,
`<div class="eyebrow">Caso de roles</div><h2>Responsabilidad sin autoridad</h2><div class="case"><b>Situación:</b> una analista es responsable de que el presupuesto cierre en fecha, pero tres áreas pueden modificar cifras sin avisarle. La gerencia la califica como “poco firme”.</div><div class="grid"><div class="card"><h3>Diagnóstico</h3><p>Hay responsabilidad final sin control sobre las entradas.</p></div><div class="card"><h3>Rediseño</h3><p>Definir fecha de congelamiento, dueños de datos y escalamiento.</p></div><div class="card"><h3>Indicador justo</h3><p>Medir cierre oportuno y calidad de datos por área, no solo a la analista.</p></div></div><div class="call"><b>Intervención:</b> una conversación de desempeño sin rediseñar el rol probablemente producirá el mismo conflicto el próximo mes.</div></section>`,
`<div class="eyebrow">Metodología 6 · actos lingüísticos</div><h2>Convertir acusaciones en coordinaciones</h2><table class="table"><tr><th>Enunciado débil</th><th>Conversión operativa</th></tr><tr><td>“Tienes que comprometerte”.</td><td>“¿Qué acción específica realizarás y para cuándo?”</td></tr><tr><td>“El informe está mal”.</td><td>“Faltan costos variables y fuente de datos”.</td></tr><tr><td>“Hazlo pronto”.</td><td>“Envíalo el jueves a las 15:00”.</td></tr><tr><td>“Siempre me dejas sola”.</td><td>“Necesito que confirmes recepción y avises bloqueos antes de las 12:00”.</td></tr></table><p>Una promesa completa incluye: quién, qué, cuándo, condiciones de satisfacción y cómo se declarará cumplida.</p></section>`,
`<div class="eyebrow">Metodología 7 · control de gestión</div><h2>El sistema puede estar fabricando la conducta que luego castiga</h2><div class="grid"><div class="card"><h3>Resultado</h3><p>Meta de velocidad → se ocultan errores.</p></div><div class="card"><h3>Acción</h3><p>Autorizaciones excesivas → atajos y frustración.</p></div><div class="card"><h3>Personal</h3><p>Sin capacitación → desempeño tratado como actitud.</p></div><div class="card"><h3>Cultura</h3><p>Se premia al que “salva el día” aunque rompa el proceso.</p></div></div><div class="call">Antes de sancionar, pregunta: ¿el diseño del control produce información confiable y conducta alineada, o incentiva ocultar, culpar y competir?</div></section>`,
`<div class="eyebrow">Caso integrador</div><h2>Nuevo sistema de inventario</h2><div class="case"><b>Situación:</b> desde la implementación, una trabajadora comete errores y entrega tarde. La jefatura quiere sancionarla por resistencia. Ella no recibió capacitación, las instrucciones cambiaron y el KPI no distingue errores heredados de errores propios.</div><div class="steps"><div class="step"><p><b>Filtro de riesgo:</b> no hay todavía señal descrita de acoso; sí existe riesgo de evaluación injusta.</p></div><div class="step"><p><b>Conversación:</b> separar hechos, impacto y dificultades.</p></div><div class="step"><p><b>Rol:</b> revisar quién carga datos, quién valida y quién corrige errores del sistema.</p></div><div class="step"><p><b>Negociación:</b> acordar capacitación, apoyo y un período de transición.</p></div><div class="step"><p><b>Control:</b> ajustar KPI para medir precisión, completitud y aprendizaje.</p></div></div></section>`,
`<div class="eyebrow">Laboratorio de decisión</div><h2>Resuelve el caso en cuatro decisiones</h2><div class="grid"><div class="card"><h3>1. Primera acción</h3><p>¿Qué harías mañana y qué no harías todavía?</p></div><div class="card"><h3>2. Frase inicial</h3><p>¿Cómo abrirías la conversación sin prejuzgar?</p></div><div class="card"><h3>3. Acuerdo</h3><p>¿Qué conducta, apoyo y estándar definirías?</p></div><div class="card"><h3>4. Seguimiento</h3><p>¿Qué medirías en 7 y 30 días?</p></div></div><textarea id="notes" rows="6" placeholder="Escribe aquí tu intervención..."></textarea><br><button class="secondary" onclick="reveal('a4')">Ver pauta de evaluación</button><div id="a4" class="answer">Una buena respuesta no etiqueta a la trabajadora; verifica hechos, escucha, revisa capacitación y rol, define un estándar posible, entrega apoyo, fija una fecha y mide resultados. Si aparece una conducta grave, cambia al canal formal.</div></section>`,
`<div class="eyebrow">Errores de implementación</div><h2>Lo que suele empeorar un conflicto</h2><div class="grid"><div class="card"><h3>Investigar con una conclusión tomada</h3><p>“Vengo a demostrar que te resistes” elimina información relevante.</p></div><div class="card"><h3>Confundir empatía con permisividad</h3><p>Escuchar no significa eliminar el estándar o el accountability.</p></div><div class="card"><h3>Negociar lo que no es negociable</h3><p>Derechos, seguridad y dignidad no son moneda de cambio.</p></div><div class="card"><h3>Firmar acuerdos vagos</h3><p>“Mejorar la comunicación” no tiene responsable ni prueba de cumplimiento.</p></div><div class="card"><h3>Medir solo el cierre</h3><p>Sin seguimiento, el conflicto reaparece con otra forma.</p></div><div class="card"><h3>Aplicar la técnica equivocada</h3><p>Una mediación no reemplaza protección ni investigación.</p></div></div></section>`,
`<div class="eyebrow">Plan de aplicación</div><h2>Tu ficha para intervenir en la organización</h2><div class="grid"><div class="card"><p><b>Hechos observables:</b> ______________________</p><p><b>Impacto:</b> _________________________________</p><p><b>Riesgo y poder:</b> __________________________</p><p><b>Causa principal:</b> __________________________</p></div><div class="card"><p><b>Metodología:</b> ______________________________</p><p><b>Primera acción:</b> ___________________________</p><p><b>Petición/acuerdo:</b> _________________________</p><p><b>Seguimiento:</b> ______________________________</p></div></div><div class="call"><b>Criterio de calidad:</b> si otra persona lee tu ficha, debería saber qué ocurrirá, quién lo hará y cómo se comprobará.</div></section>`,
`<div class="eyebrow">Árbol de decisión</div><h2>Elegir sin automatismos</h2><table class="table"><tr><th>Pregunta</th><th>Si la respuesta es sí</th><th>Herramienta</th></tr><tr><td>¿Hay riesgo de daño, acoso o violencia?</td><td>Proteger y preservar el proceso.</td><td>Formal-normativa</td></tr><tr><td>¿Es una coordinación rota sin riesgo grave?</td><td>Investigar conversando.</td><td>Conversacional</td></tr><tr><td>¿Hay intereses incompatibles pero diálogo posible?</td><td>Diseñar intercambios.</td><td>Harvard</td></tr><tr><td>¿Las partes no pueden escucharse?</td><td>Agregar estructura e imparcialidad.</td><td>Mediación</td></tr><tr><td>¿La tarea, autoridad o KPI están mal diseñados?</td><td>Corregir el contexto.</td><td>Rol / control</td></tr></table></section>`,
`<div class="eyebrow">Cierre de aprendizaje</div><h2>La intervención termina cuando cambia la coordinación</h2><div class="grid"><div class="card"><h3>Proteger</h3><p>Controlar riesgos y no exponer a quien denuncia.</p></div><div class="card"><h3>Comprender</h3><p>Separar hechos, juicios, emociones e intereses.</p></div><div class="card"><h3>Diseñar</h3><p>Acordar roles, estándares, opciones y condiciones.</p></div><div class="card"><h3>Verificar</h3><p>Medir cumplimiento, impacto y recurrencia.</p></div></div><div class="call"><b>Frase final:</b> “Un conflicto bien gestionado no solo se calma: deja una organización con mejores conversaciones, controles y responsabilidades”.</div></section>`,

const qs=[['Una jefatura dice “es una persona conflictiva”, pero no entrega hechos. ¿Qué pedirías primero?','Conductas observables, fechas, impacto y ejemplos; un juicio global no basta para decidir una intervención.'],['¿Por qué puede ser injusto medir a una analista por el cierre si tres áreas controlan sus datos?','Porque tiene responsabilidad final sin autoridad sobre las entradas; hay que revisar el diseño del rol y del indicador.'],['¿Qué harías si una persona denuncia acoso y propone “arreglarlo conversando”?','Evaluar riesgo, resguardar y activar el canal formal; la conversación puede ser complementaria, no sustitutiva.'],['Ventas quiere prometer 24 horas y Operaciones necesita 72. ¿Cómo pasas de posiciones a intereses?','Preguntar qué busca proteger cada parte: conversión y experiencia de cliente versus capacidad, calidad y cumplimiento.'],['¿Qué hace que una promesa laboral sea verificable?','Responsable, acción, fecha, condiciones de satisfacción y forma de confirmar el cumplimiento.'],['¿Cuándo una mediación sería una mala decisión?','Ante violencia, amenaza, acoso grave o una asimetría que impida participación libre y segura.']];
function summary(){document.getElementById('mtitle').textContent='🎁 Resumen aplicado';document.getElementById('mcontent').innerHTML='<p><b>Diagnostica:</b> hechos, impacto, poder, riesgo, causa y resultado.</p><p><b>Formaliza</b> cuando hay vulneración o riesgo; protege antes de investigar.</p><p><b>Conversa</b> cuando se rompió una coordinación; convierte juicios en hechos y peticiones.</p><p><b>Negocia</b> intereses, no posiciones; crea opciones con criterios objetivos.</p><p><b>Media</b> cuando el diálogo está bloqueado, si existe participación libre.</p><p><b>Revisa</b> roles, capacitación, autoridad, KPI y cultura cuando el sistema fabrica el conflicto.</p><p><b>Cierra</b> con responsable, fecha, estándar e indicador.</p><button class="action" onclick="word()">Descargar resumen en Word</button>';document.getElementById('modal').classList.add('open')}
