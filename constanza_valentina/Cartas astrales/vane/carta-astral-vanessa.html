<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartas Astral de Vanessa</title>
<style>
:root{--cream:#f4ead8;--wine:#641f32;--gold:#a47b42;--ink:#21191b;--violet:#30213d}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--wine);font-family:Georgia,serif;overflow:hidden}body:before{content:"";position:fixed;inset:12px;border:2px solid var(--wine);pointer-events:none}.shell{height:100vh;padding:28px 7vw;display:flex;flex-direction:column}.signature{position:absolute;right:8vw;top:28px;text-align:right;font-size:12px;line-height:1.35}.signature strong{display:block;font:italic 23px 'Segoe Script',cursive}.stage{flex:1;display:flex;align-items:center;justify-content:center}.card{width:min(920px,86vw);height:min(650px,76vh);border:1px solid var(--wine);background:rgba(244,234,216,.94);box-shadow:0 12px 35px #641f3222;padding:42px 8%;display:flex;flex-direction:column;justify-content:center;text-align:center}.eyebrow{letter-spacing:4px;text-transform:uppercase;font-size:12px}.glyph{font-size:48px;color:var(--gold);margin:8px}.card h1{font-size:clamp(34px,5vw,64px);font-weight:normal;margin:8px 0}.subtitle{font:italic 21px 'Segoe Script',cursive;margin:0 0 28px}.card h2{font-size:30px;font-weight:normal;margin:0 0 14px}.copy{font-size:16px;line-height:1.55;max-width:760px;margin:0 auto;white-space:pre-line}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}.btn{border:1px solid var(--wine);background:var(--wine);color:var(--cream);padding:13px 24px;border-radius:2px;font:inherit;cursor:pointer}.btn.small{font-size:13px;padding:9px 15px;background:transparent;color:var(--wine)}.btn:hover{background:var(--gold);border-color:var(--gold)}.bottom{display:flex;justify-content:space-between;align-items:center;padding:8px 0 18px}.nav{display:flex;gap:8px}.icon{width:42px;height:35px;padding:0}.progress{font-size:12px;opacity:.8}.table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}.table td,.table th{border-bottom:1px solid #641f3233;padding:6px}.oracle{font-style:italic;color:var(--violet);margin-top:16px}.note{font-size:11px;margin-top:12px;opacity:.75}.hidden{display:none}@media(max-height:720px){.card{height:70vh;padding:22px 6%}.copy{font-size:13px}.card h1{font-size:38px}.signature{top:18px}.shell{padding-top:18px}}
</style></head><body><main class="shell"><aside class="signature"><strong>Constanza Valentina</strong>cpinop@fen.uchile.cl<br>ingeniera y terapeuta holística:<br>tarot - gemoterapia - astrología</aside><section class="stage"><article class="card" id="card"></article></section><footer class="bottom"><div><button class="btn small icon" onclick="home()">⌂</button><button class="btn small icon" onclick="oracle()">⚄</button></div><div class="nav"><button class="btn small icon" onclick="prev()">←</button><span class="progress" id="progress"></span><button class="btn small icon" onclick="next()">→</button></div></footer></main>
<style>
.signature{right:1.2vw;font-size:10px;max-width:145px}.signature strong{font-size:20px}
.copy{font-size:18px;line-height:1.65}.card h2{font-size:34px}.bottom>div:first-child{display:flex;align-items:center;gap:8px}.bottom .icon{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;line-height:1}
.summary-card{justify-content:flex-start;overflow:hidden}.summary-table{overflow-y:auto;min-height:0;width:100%;padding-right:8px}.glyph.scorpio{color:var(--gold)}
@media(max-height:720px){.copy{font-size:15px;line-height:1.5}.card h2{font-size:30px}.signature{font-size:9px}.signature strong{font-size:18px}}
.signature{top:auto;bottom:18px;right:50%;transform:translateX(50%);max-width:90vw;text-align:center;font-size:9px;line-height:1.15;z-index:2}.signature strong{font-size:16px}
</style><script>
const intro=`La carta se presenta como un mapa simbólico de autoconocimiento. La metodología sideral toma como referencia el zodíaco alineado con las constelaciones observables; la tropical, más habitual en Latinoamérica, trabaja con el zodíaco estacional. Aquí se privilegia la lectura sideral porque puede ofrecer un marco que se sienta más preciso y conectado con la experiencia celeste de Vanessa, sin afirmar que exista una superioridad científica objetiva. Ambas son lenguajes interpretativos: lo importante es la resonancia y la reflexión que despiertan.`;
const sections=[
['✦','Introducción',intro],
['☉','Vista general',`Persona con rasgos introvertidos, pero emocionalidad en el aspecto emocional; en el día a día prefiere su privacidad y su tiempo a solas, pero, a pesar de eso, cuando siente emociones fuertes tiende a exteriorizarlas más que interiorizarlas. Se divide entre el colectivo: ir hacia afuera, pero a la vez hacerlo desde el Yo. Persona capaz de hacer un recorrido hacia su interior y aprender de sí misma para luego salir al mundo haciendo de ese conocimiento su sello.`],
['☉','Sol en Piscis, casa 5',`El Sol nos dice dónde una persona brilla, dónde encuentra su mejor versión. La casa 5 habla de la creatividad, de sus creaciones, inclusive hijos físicos o creativos. Piscis es agua mutable: intuición, capacidad de detectar sentimientos e intenciones ocultas, empatía y cualidad de fundirse con el resto. En luz, capacidades psíquicas; en sombra, absorber emociones ajenas y abrumarse. Brilla cuando crea y se expresa mediante el arte: cantantes, pintores, escritores, artesanos.\n\n«Yo soy a través de lo que creo»\n\nBrilla al expresarse creativamente de manera auténtica, colocando una parte de sí misma en su arte.`],
['☿','Mercurio en Piscis, casa 5',`Mercurio habla de cómo organiza pensamiento y comunicación. Junto al Sol, brilla al compartir lo que crea. Tiene habilidad para transmitir emociones mediante la oratoria, narrativas e inspiración emocional. El pensamiento se estructura de manera emocional: los sentimientos transmutan en pensamiento racional. Opera desde sensaciones e intuición, conectando con lo intangible. En sombra, puede desapegarse de la evidencia racional y sesgarse por lo emocional. Puede que tenga 2 hijos, o 2 proyectos creativos muy importantes.`],
['☾','Luna en Géminis, casa 8',`Complemento interesante con Mercurio en Piscis: el pensamiento es emocional y lo emocional es racional. La Luna habla del mundo emocional; Géminis, signo racional de aire, del conocimiento adquirido desde la mente. Puede llevar emociones al filtro racional, sopesarlas y evaluarlas. Potencial de sanarse a sí misma: ante una crisis puede leer autoayuda y aplicar lo aprendido. En luz, balance saludable; en sombra, confundirse, actuar emocionalmente cuando debería ser racional o tomar decisiones frías cuando debería escuchar emociones. La casa 8 habla de transformación: puede resignificar traumas y transformar obstáculos en oportunidades.`],
['♏','Ascendente Escorpio, casa 1',`El ascendente habla de cómo enfrenta la vida y se muestra. Escorpio saca a la luz lo oculto, conversa temas difíciles y tabúes para sanar: crea luz a partir del dolor. Puede mostrar humor negro y ausencia de miedo ante temas evitados, desafiando a ver sombras. El Yo se retroalimenta mediante interacciones profundas y significativas que la desafían a crecer.`],
['♡','Venus en Acuario, casa 4',`Venus se refiere a cómo ama y se relaciona. Acuario habla de innovación y hacer las cosas diferente. La casa 4 habla del hogar y círculo privado. Tiene capacidad de romper patrones familiares y llevar sus vínculos de una manera muy diferente a lo aprendido.`],
['♄','Saturno en Acuario, casa 4',`Saturno habla de límites, desafíos y patrones familiares heredados. Al acompañar a Venus, refuerza que puede cambiar patrones familiares relacionados con el hogar y la manera de vincularse.`],
['♂','Marte en Cáncer, casa 9',`Marte habla de cómo acciona y de dónde saca impulso; también puede hablar del padre o parejas. Padre o personas que atrae pueden tener características de Cáncer. Cáncer cuida y desea ser cuidado, pero se defiende si se siente amenazado: entrega mucho, se siente vulnerable, usa coraza y puede responder duro cuando tiene miedo. La casa 9 habla de estudios superiores y viajes. Saca fuerza de sus emociones y del deseo de cuidar a personas importantes; puede desear viajar para encontrarse con esa fuerza. La sensación de que otros la necesitan la moviliza.`],
['⌂','Medio Cielo en Cáncer, casa 9',`El medio cielo habla de una misión de vida importante. En Cáncer: aprender a cuidar sin perderse, canalizar emoción y sensibilidad para crear y dirigir proyectos significativos. Advierte que puede perder experiencias importantes si se obsesiona con proteger su corazón.`],
['☊','Nodo norte en Libra, casa 12 / nodo sur en Aries, casa 6',`El nodo sur habla de una carga del linaje o vidas anteriores ligada al individualismo (Aries). Puede haber familiares que debieron separarse del clan para hallar identidad, o ponerse a la defensiva y ser confrontacionales. Para sanar, la vida la dirige hacia Libra: vincularse y casi fundirse con otros, sin perderse, viendo que forma parte de algo mayor. Puede operar como conciliadora y unir personas que de otro modo no se juntarían. La vida la lleva a ser agente de unión y paz en lo colectivo.`],
['♃','Júpiter en Escorpio, casa 1',`Júpiter habla de expansión. Se expande al lograr autenticidad, reparar heridas de temas tabú y ayudar a sacar a la luz lo que necesitaba ser visto para sanar.`],
['♇','Plutón en Escorpio, casa 1',`La personalidad y el sentido del Yo se consolidan transformando dolor en crecimiento. Plutón representa descender a las sombras para convertirlas en luz. Conforma su identidad al indagar, no evitar, sus sombras y volver consciente lo inconsciente.`],
['♅♆','Urano y Neptuno en Capricornio, casa 3',`Urano habla de muerte, renacimiento, cambios y fin de ciclos; Neptuno, de intuición. La casa 3 habla de comunicación y pares, incluso hermanos. Capricornio es estable, estructurado y rígido. Los hermanos pueden ser fuente importante de estabilidad. La comunicación con hermanos y en general evoluciona al romper estructuras: al romperse planes de vida, se acerca a sus pares compartiendo dolores y frustraciones. Mejora al romperse lo rígido y se activa la intuición; funciona mejor en caos y espontaneidad que en rigidez.`],
['⚷','Quirón en Leo, casa 10',`Quirón habla de una herida importante: el concepto de sí misma. Puede sentir que logros no fueron celebrados o heredar la herida del linaje. Hay sensación de no ser suficiente y miedo a ser vista. La casa 10 es el legado: una herida de autoestima puede hacer sentir que no tiene derecho a dejar legado. La vida le presentará oportunidades de volverse su propio hogar y piso seguro, sanar miedo a ser ella misma y abrazar su esencia.`],
['🌑','Lilith en Tauro, casa 7',`Lilith habla del deseo, lo reprimido y la autonomía. Tauro se refiere al placer tangible, cuerpo y dinero. La casa 7 es pareja. Puede sentir que las relaciones reprimen o encierran: conflicto entre buscar estabilidad y no perder autonomía. Desafío: vincularse sin perder poder personal, derecho al placer propio ni autonomía; buscar personas que respeten esos espacios.\n\nTambién combina deseo de autonomía con seguridad y valor propio. Puede haber tensión entre «quiero una relación estable» y «no quiero que nadie tenga poder sobre mí». Puede atraer vínculos que despierten posesión, poder, fidelidad, dependencia o autonomía. Las relaciones pueden ser espejo de la sombra. Pregunta profunda: «¿Puedo amar, vincularme y disfrutar estabilidad sin entregar mi poder personal?». Integrada, construye placer + estabilidad + libertad, sin posesión ni sometimiento.`],
['🌾','Ceres en Cáncer, casa 9',`Ceres habla de cuidar y sostener. Cáncer cuida desde lo emocional; casa 9, estudios o viajes. El aprendizaje y los estudios dan satisfacción cuando se orientan al cuidado de otras personas.`],
['🦉','Pallas en Tauro, casa 7',`Pallas habla de resolver problemas. Tiene capacidad para resolver problemas tangibles; en pareja puede potenciar concretamente a su pareja e impulsarla a crecer en lo económico y profesional.`],
['💍','Juno en Sagitario, casa 2',`Juno habla de pareja y fidelidad. Sagitario busca la verdad, adrenalina y metas; casa 2, recursos materiales. Se liga dinero con pareja: posibilidad de negocio con una pareja mediante trabajo en equipo orientado a metas.`],
['🔥','Vesta en Géminis, casa 8',`Vesta representa aquello a lo que consagramos energía. Géminis habla de conocimiento e ideas racionales; casa 8, transformación. Da mucha importancia al conocimiento nuevo y a comunicarlo; puede disfrutar enseñando o haciendo clases que ayuden a transformar la vida de otros.`],
['✧','Cierre',`Vanessa aparece como una persona capaz de convertir sensibilidad en creación, profundidad en conciencia y heridas en un legado propio. Su recorrido invita a unir intuición y razón, autonomía y vínculo, protección y apertura. La carta sugiere que su fuerza no está en dejar de sentir, sino en aprender a darle forma: crear, comunicar, cuidar y transformar. Cuando se permite ser su propio hogar, puede salir al mundo con una voz auténtica y convertirse en puente para otros.`]
];
const summary=[['Sol','Piscis · casa 5'],['Mercurio','Piscis · casa 5'],['Luna','Géminis · casa 8'],['Ascendente','Escorpio · casa 1'],['Venus','Acuario · casa 4'],['Saturno','Acuario · casa 4'],['Marte','Cáncer · casa 9'],['Medio Cielo','Cáncer · casa 9'],['Nodo norte','Libra · casa 12'],['Júpiter / Plutón','Escorpio · casa 1'],['Urano / Neptuno','Capricornio · casa 3'],['Quirón','Leo · casa 10'],['Lilith','Tauro · casa 7'],['Ceres','Cáncer · casa 9'],['Pallas','Tauro · casa 7'],['Juno','Sagitario · casa 2'],['Vesta','Géminis · casa 8']];
let i=0;function render(){let[s,t,b]=sections[i];document.getElementById('card').innerHTML=`<div class="glyph">${s}</div><div class="eyebrow">Carta astral sideral</div><h2>${t}</h2><p class="copy">${b}</p>${i===0?`<div class="actions"><button class="btn" onclick="next()">Comenzar recorrido</button><button class="btn small" onclick="showSummary()">tabla resumen</button><button class="btn small" onclick="downloadDocx()">descargar documento word</button></div>`:''}`;document.getElementById('progress').textContent=`${i+1} / ${sections.length}`}function next(){if(i<sections.length-1){i++;render()}}function prev(){if(i>0){i--;render()}}function home(){i=0;render()}function showSummary(){document.getElementById('card').innerHTML=`<div class="glyph">✦</div><h2>Tabla resumen</h2><table class="table"><tbody>${summary.map(x=>`<tr><th>${x[0]}</th><td>${x[1]}</td></tr>`).join('')}</tbody></table><div class="actions"><button class="btn small" onclick="home()">volver al inicio</button><button class="btn small" onclick="downloadDocx()">descargar documento word</button></div>`}const qs=[['¿Dónde brilla Vanessa?','Al crear: «Yo soy a través de lo que creo».'],['¿Cuál es su gran aprendizaje?','Unir autonomía y vínculo, convirtiéndose en agente de paz.'],['¿Qué la ayuda a sanar?','Indagar sus sombras, transformarlas y comunicar lo aprendido.'],['¿Qué debe cuidar en pareja?','Su placer, límites, poder personal y autonomía.'],['¿Cuál es su misión?','Cuidar sin perderse y crear proyectos con sentido.']];function oracle(){let q=qs[Math.floor(Math.random()*qs.length)];document.getElementById('card').innerHTML=`<div class="glyph">⚄</div><div class="eyebrow">Oráculo de la carta</div><h2>${q[0]}</h2><p class="oracle">${q[1]}</p><div class="actions"><button class="btn" onclick="oracle()">otra pregunta</button><button class="btn small" onclick="home()">home</button></div>`}async function downloadDocx(){const text=sections.map(x=>x[1]+'\n\n'+x[2]).join('\n\n');const html=`<html><head><meta charset="utf-8"><style>body{font-family:Georgia;color:#641f32}h1{font-size:28pt}h2{font-size:18pt;border-bottom:1px solid #641f32}p{line-height:1.5}</style></head><body><h1>Cartas Astral de Vanessa</h1><p><i>por Constanza Valentina</i></p>${sections.map(x=>`<h2>${x[1]}</h2><p>${x[2].replaceAll('\n','<br>')}</p>`).join('')}</body></html>`;const blob=new Blob(['\ufeff',html],{type:'application/msword'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Cartas_Astral_de_Vanessa.doc';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();
showSummary=function(){document.getElementById('card').className='card summary-card';document.getElementById('card').innerHTML='<div class="glyph">✦</div><h2>Tabla resumen</h2><div class="summary-table"><table class="table"><tbody>'+summary.map(x=>`<tr><th>${x[0]}</th><td>${x[1]}</td></tr>`).join('')+'</tbody></table></div>'};const oldRender=render;render=function(){oldRender();const g=document.querySelector('.glyph');if(g&&sections[i][0]==='♏')g.classList.add('scorpio')};
</script></body></html>
